---
# YAML format - Example configuration
# All of the hosts in the infrastructure group are managed via SSH

all:
  children:
    infrastructure:
      hosts:
        chronos:
          ansible_host: 128.100.103.160
        ciracache:
          ansible_host: ciracache.utoronto.ca
        crisco:
          ansible_host: crisco.its.utoronto.ca
        doghaus:
          ansible_host: doghaus.eis.utoronto.ca
          ansible_connection: local
        dns1:
          ansible_host: dns1.utoronto.ca
        dns4:
          ansible_host: dns4.utoronto.ca
        dns5:
          ansible_host: dns5.utoronto.ca
        dns6:
          ansible_host: dns6.eis.utoronto.ca
        dns8:
          ansible_host: dns8.utoronto.ca
        dns9:
          ansible_host: dns9.utoronto.ca
        fs:
          ansible_host: fs.eis.utoronto.ca
        fs.eis:
          ansible_host: fs.eis.utoronto.ca
        lala:
          ansible_host: lala.quist.ca
        madhaus:
          ansible_host: madhaus.eis.utoronto.ca
        mirror:
          ansible_host: mirror.eis.utoronto.ca
        netflow:
          ansible_host: netflow.utoronto.ca
        ns1:
          ansible_host: ns1.utoronto.ca
        ns2:
          ansible_host: ns2.utoronto.ca
        ns2.eis:
          ansible_host: ns2.eis.utoronto.ca
        ns7:
          ansible_host: ns7.utoronto.ca
        ns8:
          ansible_host: ns8.utoronto.ca
        chime:
          ansible_host: chime.utoronto.ca
        obsd-test:
          ansible_host: obsd.eis.utoronto.ca
        syncserver:
          ansible_host: syncserver.gw.utoronto.ca
        tick:
          ansible_host: dns4.utoronto.ca
        tock:
          ansible_host: dns1.utoronto.ca
        tyme:
          ansible_host: tyme.utoronto.ca
        xtern:
          ansible_host: xtern.gtanet.ca

      vars:
        ansible_connection: ssh
        become: yes

# OS-specific groups

    openbsd:
      hosts:
        chronos:
        ciracache:
        crisco:
        dns1:
        ns1:
        dns4:
        dns5:
        dns6:
        dns8:
        fs:
        netflow:
        obsd-test:
        syncserver:
        tick:
        tock:
        xtern:   
      vars:
        ansible_python_interpreter: auto_silent
        ansible_become: true
        ansible_become_method: doas
        ansible_remote_tmp: /tmp

    ubuntu18:
      hosts:
        chime:
        dns9:
        ns2:
      vars:
        ansible_python_interpreter: /usr/bin/python3
        ansible_become_method: sudo

    ubuntu20:
      hosts:
        chime:
      vars:
        ansible_python_interpreter: /usr/bin/python3
        ansible_become_method: sudo

    ubuntu24:
      hosts:
        doghaus:
        madhaus:
        mirror:
        ns8:
      vars:
        ansible_python_interpreter: /usr/bin/python3
        ansible_become_method: doas

    ubuntu:
      children:
        ubuntu18:
        ubuntu20:
        ubuntu24:
      vars:
        ansible_python_interpreter: /usr/bin/python3
        ansible_become_method: sudo

    raspbian:
      hosts:
        tyme:
      vars:
        ansible_python_interpreter: /usr/bin/python3

    debian:
      children:
        ubuntu:
        raspbian:

# Server Functional Group-specific configurations

    bacula_directors:
      hosts:
        mirror:

    bacula_storage_nodes:
      hosts:
        mirror:
        dns5:
        doghaus:

    bacula_clients:
      hosts:
        ciracache:
        dns1:
        dns4:
        dns5:
        dns6:
        dns8:
        dns9:
        fs:
        netflow:
        ns8:
        obsd-test:
        syncserver:
        tick:
        tock:
        tyme:
        xtern:

    bacula_console:
      hosts:
        mirror:

    authoritative_dns_servers:
      hosts:
        ns1:
        ns2:
        ns8:

    caching_dns_servers:
      hosts:
        dns1:
        dns4:
        dns5:
        dns6:
        dns8:
        dns9:

    unbound_servers:
      hosts:
        dns1:
        dns4:
        dns5:
        obsd-test:

    dnsdist_servers:
      hosts:
        dns1:
        dns4:
        dns5:
        obsd-test:

    # Super group: All DNS servers (authoritative + recursive)
    all_dns:
      children:
        authoritative_dns_servers:
        caching_dns_servers:

    wireguard_servers:
      hosts:
        ciracache:
      vars:
        pf_external_interface: em0
        pf_internal_interface: em1

    ntp_clients:
      hosts:
        ciracache:
        crisco:
        dns6:
        dns8:
        dns9:
        netflow:
        obsd-test:
        syncserver:
        xtern:
        doghaus:
        madhaus:
        ns8:

    ntp_servers:
      hosts:
        chronos:
        dns1:
        dns4:
        dns5:
        dns8:
        fs:
        ns2:

    duo_enabled:
      hosts:
        obsd-test:
        ns8:
        madhaus:
